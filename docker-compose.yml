# Prokura dev stack — NON-PRODUCTION (dev-mode components, documented dev creds).
# Minimum Keycloak: 26.4 (MCP AS support, stored-IdP-token refresh); pinned below.
name: prokura

services:
  postgres:
    # pgvector-enabled Postgres (M5): the stock postgres:17-alpine does NOT bundle
    # the `vector` extension (proven by the M5 spike). pgvector/pgvector:pg17 is
    # Postgres 17 + pgvector 0.8.6; the RAG store lives here (no new container).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prokura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prokura-dev}
      POSTGRES_DB: ${POSTGRES_DB:-prokura}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prokura}"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      # M3: built-in CIBA HTTP authentication channel points at the approval
      # service (F6-A spike proved this transport in M0; ciba-spike is retained
      # behind the `spike` profile as a reference receiver).
      - --spi-ciba-auth-channel--ciba-http-auth-channel--http-authentication-channel-uri=http://approval:8120/ciba/delegate
      # Telemetry (flag spellings verified against this image: tracing-* = traces,
      # telemetry-* = OTLP metrics/logs — two distinct families in 26.7)
      - --tracing-enabled=true
      - --tracing-endpoint=http://lgtm:4317
      - --tracing-sampler-type=always_on
      - --tracing-service-name=keycloak
      - --features=opentelemetry-metrics,opentelemetry-logs # preview features gating telemetry-metrics-*/telemetry-logs-*
      - --telemetry-metrics-enabled=true
      - --telemetry-metrics-endpoint=http://lgtm:4317
      - --metrics-enabled=true
      - --event-metrics-user-enabled=true # per-event counters (login, code_to_token, ...)
      # Logs → Loki via OTLP; success-level=info surfaces realm events (LOGIN etc.)
      # in the log stream, giving realtime audit visibility without a tailer
      - --telemetry-logs-enabled=true
      - --telemetry-logs-endpoint=http://lgtm:4317
      - --spi-events-listener--jboss-logging--success-level=info
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Fixed hostname so token issuers match from both the host (localhost:8180)
      # and inside the compose network (keycloak:8080) — the CIBA callback
      # validates the delegation JWT's issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./deploy/keycloak/acme-realm.json:/opt/keycloak/data/import/acme-realm.json:ro
    ports:
      - "8180:8080" # host 8180: leaves 8080 free for other local stacks
      - "9000:9000" # management (health)
    depends_on:
      postgres:
        condition: service_healthy

  openfga:
    image: openfga/openfga:v1.18.3
    # Trace flags verified against this image (`run --help`)
    command: run --trace-enabled --trace-otlp-endpoint=lgtm:4317 --trace-sampler=always_on --trace-sample-ratio=1
    ports:
      - "8081:8080" # HTTP API (gRPC stays internal on 8081)
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 3s
      timeout: 3s
      retries: 20

  openfga-init:
    image: curlimages/curl:8.16.0
    volumes:
      - ./deploy/openfga:/deploy:ro
    entrypoint: ["/bin/sh", "/deploy/init.sh"]
    environment:
      FGA_API_URL: http://openfga:8080
      FGA_STORE_NAME: prokura
    depends_on:
      openfga:
        condition: service_healthy

  openbao:
    image: openbao/openbao:2.6.1
    command: server -dev -dev-root-token-id=${BAO_DEV_ROOT_TOKEN:-prokura-dev-root} -dev-listen-address=0.0.0.0:8200 -config=/openbao/config/audit.hcl
    volumes:
      - ./deploy/openbao/audit.hcl:/openbao/config/audit.hcl:ro
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  openbao-init:
    image: openbao/openbao:2.6.1
    volumes:
      - ./deploy/openbao/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN:-prokura-dev-root}
    depends_on:
      openbao:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    command: serve
    volumes:
      - ./deploy/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-data:/var/lib/ntfy
    ports:
      - "8090:80"

  # M3: provision the approval service's ntfy publisher (deny-all server, F7).
  ntfy-init:
    image: binwiederhier/ntfy:v2.27.0
    entrypoint: ["sh", "/init.sh"]
    environment:
      NTFY_APPROVAL_PASSWORD: ${NTFY_APPROVAL_PASSWORD:-prokura-approval-dev}
    volumes:
      - ./deploy/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./deploy/ntfy/init.sh:/init.sh:ro
      - ntfy-data:/var/lib/ntfy
    depends_on:
      - ntfy
    restart: on-failure

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "1025:1025" # SMTP sink
      - "8025:8025" # web UI + API

  # Observability receiver: Grafana + Tempo + Loki + Prometheus in one dev
  # container. Telemetry is fire-and-forget — nothing depends_on this service
  # and the stack stays fully functional with it stopped.
  lgtm:
    image: grafana/otel-lgtm:0.30.0
    ports:
      - "3001:3000" # Grafana UI (3000 left free for other local stacks)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      # provider yaml sits alongside the image's own provider; dashboards JSON elsewhere
      - ./deploy/lgtm/prokura-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/prokura.yaml:ro
      - ./deploy/lgtm/dashboards:/otel-lgtm/prokura-dashboards:ro

  # Prokura Console — bespoke headline dashboard (dark, self-contained),
  # proxying Prometheus/Loki/Tempo through Grafana's datasource API.
  console:
    build: ./services/console
    ports:
      - "8095:8095"
    environment:
      GRAFANA_URL: http://lgtm:3000
    depends_on:
      - lgtm

  # M8: Authority Console — the principal's aggregated authority register. A
  # trusted *surface* with its own OIDC session (authority-ui) that relays the
  # signed-in user's own authority downstream by RFC 8693 exchange (authority-
  # console). It reads FGA/broker/approval and Loki, and drives consent revoke
  # and provider linking — never a tuple-writer. Fire-and-forget telemetry.
  authority:
    build: ./services/authority
    ports:
      - "8160:8160"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      AUTHORITY_PUBLIC_URL: http://localhost:8160
      UI_CLIENT_ID: authority-ui
      UI_CLIENT_SECRET: ${AUTHORITY_UI_CLIENT_SECRET:-authority-ui-dev-secret}
      EXCHANGE_CLIENT_ID: authority-console
      EXCHANGE_CLIENT_SECRET: ${AUTHORITY_CONSOLE_CLIENT_SECRET:-authority-console-dev-secret}
      SESSION_SECRET: ${AUTHORITY_SESSION_SECRET:-authority-session-dev-secret}
      BROKER_URL: http://token-broker:8110
      BROKER_AUDIENCE: token-broker
      APPROVAL_URL: http://approval:8120
      APPROVAL_AUDIENCE: approval
      APPROVAL_PUBLIC_URL: http://localhost:8120
      GRAFANA_URL: http://lgtm:3000
      OPENFGA_URL: http://openfga:8080
      FGA_STORE_NAME: prokura
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: authority
    depends_on:
      keycloak:
        condition: service_started
      openfga:
        condition: service_started

  # M2: Token Broker — provider-token lifecycle (leases, scope-down, per-agent
  # consent, audit). First instrumented Python service; OTLP is fire-and-forget
  # so there is intentionally NO depends_on: lgtm.
  token-broker:
    build: ./services/token-broker
    ports:
      - "8110:8110"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      BROKER_AUDIENCE: token-broker
      OPENBAO_URL: http://openbao:8200
      BROKER_BAO_TOKEN: prokura-broker-dev-token
      OPENFGA_URL: http://openfga:8080
      FGA_STORE_NAME: prokura
      DATABASE_URL: postgresql://${POSTGRES_USER:-prokura}:${POSTGRES_PASSWORD:-prokura-dev}@postgres:5432/${POSTGRES_DB:-prokura}
      # M7: consent surface session (broker-ui client).
      BROKER_PUBLIC_URL: http://localhost:8110
      UI_CLIENT_ID: broker-ui
      UI_CLIENT_SECRET: ${BROKER_UI_CLIENT_SECRET:-broker-ui-dev-secret}
      SESSION_SECRET: ${BROKER_SESSION_SECRET:-broker-session-dev-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: token-broker
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      openbao:
        condition: service_started
      openfga:
        condition: service_started

  # M3: Approval Service — CIBA-gated human approval. Keycloak's CIBA HTTP
  # channel POSTs delegation requests here; the trusted UI renders the
  # service-held payload and relays the decision to Keycloak's callback. Joins
  # the trusted computing base. Fire-and-forget telemetry (no depends_on: lgtm).
  approval:
    build: ./services/approval
    ports:
      - "8120:8120"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      DATABASE_URL: postgresql://${POSTGRES_USER:-prokura}:${POSTGRES_PASSWORD:-prokura-dev}@postgres:5432/${POSTGRES_DB:-prokura}
      NTFY_URL: http://ntfy
      NTFY_PUBLIC_URL: http://localhost:8090
      NTFY_USER: prokura-approval
      NTFY_APPROVAL_PASSWORD: ${NTFY_APPROVAL_PASSWORD:-prokura-approval-dev}
      APPROVAL_PUBLIC_URL: http://localhost:8120
      APPROVAL_AUDIENCE: approval
      # M7: surface session (approval-ui client) + server-initiated CIBA
      # (approval-service is the realm's only CIBA-grant client, ADR-0019).
      UI_CLIENT_ID: approval-ui
      UI_CLIENT_SECRET: ${APPROVAL_UI_CLIENT_SECRET:-approval-ui-dev-secret}
      SESSION_SECRET: ${APPROVAL_SESSION_SECRET:-approval-session-dev-secret}
      CIBA_CLIENT_ID: approval-service
      CIBA_CLIENT_SECRET: ${APPROVAL_CIBA_CLIENT_SECRET:-approval-service-dev-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: approval
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # M3: Tools-API — a resource server exposing the gated `email.send` action.
  # Verifies the audience (M1 defense) then hash + single-use via the approval
  # service before sending through the Mailpit sink.
  tools-api:
    build: ./services/tools-api
    ports:
      - "8130:8130"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      TOOLS_AUDIENCE: agent-tools-api
      APPROVAL_URL: http://approval:8120
      MAILPIT_HOST: mailpit
      MAILPIT_PORT: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: tools-api
    depends_on:
      keycloak:
        condition: service_started

  # M4: MCP server — an OAuth 2.1 resource server (RFC 9728 metadata, aud=mcp-server
  # validation) that is also a minimal MCP server (initialize/tools/list/tools/call).
  # Its tools drive the chain: get_provider_token (→ broker) and send_email (→
  # tools-api, reactive approval). It exchanges (RFC 8693) the inbound MCP token for
  # each downstream call and never forwards it. Fire-and-forget telemetry (no
  # depends_on: lgtm).
  mcp:
    build: ./services/mcp
    ports:
      - "8140:8140"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      MCP_AUDIENCE: mcp-server
      MCP_PUBLIC_URL: http://localhost:8140
      MCP_CLIENT_ID: mcp-server
      MCP_CLIENT_SECRET: mcp-server-dev-secret
      BROKER_URL: http://token-broker:8110
      BROKER_AUDIENCE: token-broker
      TOOLS_URL: http://tools-api:8130
      TOOLS_AUDIENCE: agent-tools-api
      RAG_URL: http://rag:8150
      RAG_AUDIENCE: rag-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: mcp
    depends_on:
      keycloak:
        condition: service_started

  # M5: RAG retriever — Flow D authorization-filtered retrieval. Validates
  # aud=rag-server (F2), embeds the query offline, pulls top-K from pgvector, then
  # authorizes candidates against OpenFGA AS THE END USER (never the agent). Seeds
  # the Drive-shaped corpus (tuples before queryability) at startup. Fire-and-forget
  # telemetry (no depends_on: lgtm).
  rag:
    build: ./services/rag
    ports:
      - "8150:8150"
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://localhost:8180/realms/prokura
      PROKURA_REALM: prokura
      RAG_AUDIENCE: rag-server
      OPENFGA_URL: http://openfga:8080
      FGA_STORE_NAME: prokura
      DATABASE_URL: postgresql://${POSTGRES_USER:-prokura}:${POSTGRES_PASSWORD:-prokura-dev}@postgres:5432/${POSTGRES_DB:-prokura}
      RAG_CORPUS_DIR: /deploy/rag/corpus
      RAG_MANIFEST_PATH: /deploy/rag/manifest.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      OTEL_SERVICE_NAME: rag
    volumes:
      - ./deploy/rag:/deploy/rag:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      openfga:
        condition: service_started

  # M0 spike (F6-A): receives Keycloak's CIBA delegation POSTs and returns
  # decisions on Keycloak's callback endpoint. Profile-gated; enable with
  #   docker compose --profile spike up -d
  ciba-spike:
    profiles: ["spike"]
    build: ./spike/ciba-http-channel
    ports:
      - "8000:8000"

volumes:
  ntfy-data:
