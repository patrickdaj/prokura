[project]
name = "prokura"
version = "0.1.0"
description = "Prokura agent SDK — delegated identity for AI agents (Python v0)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prokura"]
