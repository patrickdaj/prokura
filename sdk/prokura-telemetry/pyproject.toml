[project]
name = "prokura-telemetry"
version = "0.1.0"
description = "Shared OpenTelemetry wiring for Prokura services — one module, imported by all (was six copied telemetry.py)"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prokura_telemetry"]
