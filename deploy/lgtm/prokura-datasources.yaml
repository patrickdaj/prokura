# Prokura-owned Grafana datasource provisioning.
#
# Mounted over the otel-lgtm image's own grafana-datasources.yaml so the
# trace<->log correlation is OWNED BY THIS REPO and cannot silently drift when the
# base image is bumped. Reproduces the image's Prometheus/Tempo/Loki/Pyroscope
# datasources verbatim, and pins the two joins this change depends on:
#
#   - Tempo  tracesToLogsV2  -> from a selected span, jump to its Loki audit lines
#            filtered by the NATIVE trace id (the trace->logs jump; replaces the
#            bespoke console's hand-rolled version). This is the derived field on
#            the trace id the observability spec requires.
#   - Loki   derivedFields   -> from an audit line's trace_id, jump back to the Tempo
#            trace (logs->trace), closing the loop.
#
# Correlation is the native OTel trace context (trace_id attached to every audit
# record by the logging handler) — NOT a hand-copied prokura.correlation_id.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: true
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: true
    jsonData:
      # Trace -> logs: from a span, land on its Prokura audit lines by the native
      # trace id. `{service.name} | trace_id = "<id>"` — no correlation-id copy.
      tracesToLogsV2:
        customQuery: true
        datasourceUid: "loki"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"

      serviceMap:
        datasourceUid: "prometheus"
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "loki"

  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: true
    jsonData:
      # Logs -> trace: turn an audit line's trace_id into a link to the Tempo trace.
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "tempo"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    url: http://127.0.0.1:4040
